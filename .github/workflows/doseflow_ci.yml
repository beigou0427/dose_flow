name: DoseFlow Enterprise Production & Release Pipeline

on:
  push:
    branches: [ "main", "release/*" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Manual Build Target Selection'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android_only
          - ios_only

jobs:
  production_gate_and_obfuscated_build:
    name: Production Quality Gate & Anti-Reverse Build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Sovereign Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Sovereign Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-stable-macos'
          cache-path: '${{ runner.tool_cache }}/flutter'

      - name: 📦 Retrieve & Verify Dependencies
        run: flutter pub get
      - name: 🔍 Quality Gate 1 - Static Analysis (Zero Warnings Tolerance)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 🧪 Quality Gate 2 - Automated Test Suite (42/42 Verification)
        run: flutter test --coverage

      - name: 🛡️ Prepare Sovereign Symbol Isolation Directories
        run: |
          mkdir -p build/symbols/android
          mkdir -p build/symbols/ios
      - name: 🤖 Build Obfuscated Android App Bundle (AAB)
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'android_only' || github.event_name != 'workflow_dispatch' }}
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/symbols/android

      - name: 🍎 Build Obfuscated iOS App (No Codesign for CI check)
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ios_only' || github.event_name != 'workflow_dispatch' }}
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate \
            --split-debug-info=build/symbols/ios

      - name: 📦 Archive Android Production Artifact
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'android_only' || github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: doseflow-android-aab-obfuscated
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 🔐 Archive De-obfuscation Symbol Maps (Sovereign Vault)
        uses: actions/upload-artifact@v4
        with:
          name: doseflow-sovereign-symbols
          path: build/symbols/
          retention-days: 90